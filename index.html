<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaun Banega Crorepati - Quiz Edition</title>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at center, #0f174a 0%, #050821 70%, #020412 100%);
            --gold-primary: #f5b301;
            --gold-secondary: #ffd700;
            --blue-border: #2a3c9b;
            --card-bg: rgba(9, 14, 48, 0.9);
            --correct: #10b981;
            --wrong: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            width: 100%;
            max-width: 1100px;
            background: var(--card-bg);
            border: 2px solid var(--gold-primary);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(245, 179, 1, 0.25);
            padding: 25px;
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 25px;
        }

        @media (max-width: 850px) {
            .game-container {
                grid-template-columns: 1fr;
            }
            .money-tree {
                display: none; /* Hide ladder on very small screens for clean UX */
            }
        }

        /* Top Bar & Lifelines */
        .top-bar {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--blue-border);
            padding-bottom: 15px;
        }

        .logo-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--gold-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
        }

        .lifelines {
            display: flex;
            gap: 12px;
        }

        .lifeline-btn {
            background: #111a58;
            border: 2px solid var(--gold-primary);
            color: #fff;
            padding: 8px 14px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .lifeline-btn:hover:not(:disabled) {
            background: var(--gold-primary);
            color: #000;
            transform: scale(1.05);
        }

        .lifeline-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            border-color: #666;
            text-decoration: line-through;
        }

        /* Main Quiz Arena */
        .main-arena {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .question-box {
            background: #0d164d;
            border: 2px solid var(--gold-primary);
            border-radius: 12px;
            padding: 25px 20px;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 600;
            min-height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
            margin-bottom: 25px;
            position: relative;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: #0b1342;
            border: 2px solid var(--blue-border);
            color: #fff;
            padding: 16px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
            text-align: left;
            transition: all 0.2s ease;
            position: relative;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--gold-primary);
            background: #152270;
            box-shadow: 0 0 10px rgba(245, 179, 1, 0.3);
        }

        .option-btn .opt-prefix {
            color: var(--gold-secondary);
            font-weight: 700;
            margin-right: 12px;
        }

        .option-btn.selected {
            background: #ca8a04;
            color: #000;
            border-color: #eab308;
            font-weight: bold;
        }

        .option-btn.correct {
            background: var(--correct) !important;
            border-color: #34d399 !important;
            color: #fff !important;
        }

        .option-btn.wrong {
            background: var(--wrong) !important;
            border-color: #f87171 !important;
            color: #fff !important;
        }

        .option-btn.hidden {
            visibility: hidden;
        }

        /* Navigation Buttons */
        .nav-controls {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
        }

        .nav-btn {
            background: #1e293b;
            color: #fff;
            border: 1px solid var(--blue-border);
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .nav-btn:hover:not(:disabled) {
            background: #334155;
            border-color: #cbd5e1;
        }

        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-submit {
            background: var(--gold-primary);
            color: #000;
            border: none;
        }

        .btn-submit:hover:not(:disabled) {
            background: var(--gold-secondary);
        }

        /* Bottom Hint Box */
        .hint-container {
            background: rgba(255, 215, 0, 0.08);
            border: 1px dashed var(--gold-primary);
            border-radius: 8px;
            padding: 15px;
            font-size: 0.95rem;
            min-height: 55px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hint-label {
            color: var(--gold-secondary);
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8rem;
            background: rgba(0,0,0,0.5);
            padding: 3px 8px;
            border-radius: 4px;
            white-space: nowrap;
        }

        /* Money Ladder Sidebar */
        .money-tree {
            background: #080d30;
            border: 1px solid var(--blue-border);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column-reverse;
            gap: 6px;
        }

        .ladder-step {
            display: flex;
            justify-content: space-between;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #94a3b8;
        }

        .ladder-step.active {
            background: var(--gold-primary);
            color: #000;
            font-weight: 800;
            box-shadow: 0 0 10px var(--gold-primary);
        }

        .ladder-step.safe {
            color: #fff;
        }

        /* Modal for Audience Poll */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #0d164d;
            border: 2px solid var(--gold-primary);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        .poll-bars {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            height: 160px;
            margin: 20px 0;
            padding-bottom: 5px;
            border-bottom: 2px solid #fff;
        }

        .poll-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            width: 40px;
        }

        .poll-bar {
            width: 100%;
            background: var(--gold-primary);
            border-radius: 4px 4px 0 0;
            transition: height 0.5s ease;
        }

        /* Result View */
        .result-screen {
            display: none;
            grid-column: 1 / -1;
            text-align: center;
            padding: 30px;
        }

        .result-screen h2 {
            color: var(--gold-secondary);
            font-size: 2.2rem;
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin: 30px 0;
        }

        .stat-card {
            background: #0d164d;
            border: 1px solid var(--blue-border);
            padding: 20px;
            border-radius: 12px;
        }

        .stat-val {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--gold-primary);
            margin-top: 5px;
        }

        .restart-btn {
            background: var(--gold-primary);
            color: #000;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
        }
        .restart-btn:hover {
            transform: scale(1.05);
            background: var(--gold-secondary);
        }
    </style>
</head>
<body>

<div class="game-container" id="quizContainer">
    <!-- Top Bar: Logo & Lifelines -->
    <div class="top-bar">
        <div class="logo-title">KBC Quiz</div>
        <div class="lifelines">
            <button class="lifeline-btn" id="ll-fifty" onclick="useFiftyFifty()">50:50</button>
            <button class="lifeline-btn" id="ll-poll" onclick="useAudiencePoll()">📊 Poll</button>
            <button class="lifeline-btn" id="ll-flip" onclick="useFlipQuestion()">🔄 Flip</button>
        </div>
    </div>

    <!-- Main Quiz Body -->
    <div class="main-arena">
        <div>
            <div class="question-box" id="questionText">Loading question...</div>
            <div class="options-grid" id="optionsGrid">
                <!-- Dynamically generated buttons -->
            </div>
        </div>

        <div>
            <!-- Back & Next Navigation -->
            <div class="nav-controls">
                <button class="nav-btn" id="prevBtn" onclick="navigate(-1)">← Back</button>
                <button class="nav-btn btn-submit" id="nextBtn" onclick="navigate(1)">Next →</button>
            </div>

            <!-- Hint Section at Bottom -->
            <div class="hint-container" id="hintBox">
                <span class="hint-label">Hint / Explanation</span>
                <span id="hintText">Answer the question to reveal insights and background facts.</span>
            </div>
        </div>
    </div>

    <!-- Money Ladder -->
    <div class="money-tree" id="moneyLadder">
        <!-- Rendered by JS -->
    </div>
</div>

<!-- Audience Poll Modal -->
<div class="modal" id="pollModal">
    <div class="modal-content">
        <h3>Audience Poll Results</h3>
        <div class="poll-bars" id="pollBars"></div>
        <button class="nav-btn" onclick="closeModal()">Continue</button>
    </div>
</div>

<!-- End Analysis Screen -->
<div class="game-container result-screen" id="resultScreen">
    <h2>Game Analysis</h2>
    <p style="font-size: 1.1rem; color: #cbd5e1;">Here is how you performed on the Hot Seat:</p>
    
    <div class="stats-grid">
        <div class="stat-card">
            <div>Total Questions</div>
            <div class="stat-val" id="resTotal">0</div>
        </div>
        <div class="stat-card">
            <div>Correct Answers</div>
            <div class="stat-val" style="color: var(--correct);" id="resCorrect">0</div>
        </div>
        <div class="stat-card">
            <div>Wrong Answers</div>
            <div class="stat-val" style="color: var(--wrong);" id="resWrong">0</div>
        </div>
        <div class="stat-card">
            <div>Accuracy</div>
            <div class="stat-val" id="resAccuracy">0%</div>
        </div>
        <div class="stat-card" style="grid-column: 1 / -1;">
            <div>Total Virtual Prize Won</div>
            <div class="stat-val" style="color: var(--gold-secondary);" id="resPrize">₹ 0</div>
        </div>
    </div>

    <button class="restart-btn" onclick="restartQuiz()">Play Again</button>
</div>

<script>
    // Question Bank
    const quizData = [
        {
            question: "Which planet in our solar system is known as the 'Red Planet'?",
            options: ["Venus", "Mars", "Jupiter", "Saturn"],
            answer: 1,
            hint: "Mars appears reddish due to the pervasive presence of iron oxide (rust) on its surface.",
            prize: "₹ 10,000"
        },
        {
            question: "Who is known as the Father of the Indian Constitution?",
            options: ["Mahatma Gandhi", "Dr. B. R. Ambedkar", "Jawaharlal Nehru", "Sardar Patel"],
            answer: 1,
            hint: "Dr. B. R. Ambedkar served as the chairman of the Drafting Committee of the Constituent Assembly.",
            prize: "₹ 50,000"
        },
        {
            question: "Which of the following is the highest mountain peak located entirely in India?",
            options: ["Kanchenjunga", "Nanda Devi", "K2", "Kamet"],
            answer: 1,
            hint: "While Kanchenjunga lies on the India-Nepal border, Nanda Devi is the highest peak located entirely within India.",
            prize: "₹ 1,60,000"
        },
        {
            question: "In computer science, what does 'HTTP' stand for?",
            options: [
                "HyperText Transfer Protocol", 
                "High Transfer Text Process", 
                "Hyperlink Text Technology Protocol", 
                "Host Transfer Tool Program"
            ],
            answer: 0,
            hint: "HTTP is the foundational protocol used by the World Wide Web for transferring web pages.",
            prize: "₹ 6,40,000"
        },
        {
            question: "Which element has the chemical symbol 'Au'?",
            options: ["Silver", "Gold", "Copper", "Platinum"],
            answer: 1,
            hint: "'Au' comes from the Latin word 'Aurum', meaning shining dawn.",
            prize: "₹ 12,50,000"
        },
        {
            question: "Who was the first person to travel into space?",
            options: ["Neil Armstrong", "Buzz Aldrin", "Yuri Gagarin", "Rakesh Sharma"],
            answer: 2,
            hint: "Soviet cosmonaut Yuri Gagarin orbited the Earth on April 12, 1961, aboard Vostok 1.",
            prize: "₹ 50,00,000"
        },
        {
            question: "Which Indian city is famously known as the 'Silicon Valley of India'?",
            options: ["Hyderabad", "Pune", "Bengaluru", "Chennai"],
            answer: 2,
            hint: "Bengaluru earned this title because it is the nation's leading information technology exporter.",
            prize: "₹ 1 Crore"
        }
    ];

    // Extra question for "Flip Question" lifeline
    const flippedQuestion = {
        question: "Which is the longest river in the world?",
        options: ["Amazon River", "Nile River", "Yangtze River", "Mississippi River"],
        answer: 1,
        hint: "The Nile River in northeastern Africa flows approximately 6,650 kilometers (4,132 miles).",
        prize: "Replaced Question"
    };

    let currentIndex = 0;
    let userAnswers = new Array(quizData.length).fill(null);
    let usedLifelines = { fifty: false, poll: false, flip: false };

    // Initial Load
    function init() {
        renderLadder();
        loadQuestion();
    }

    // Render Money Ladder
    function renderLadder() {
        const ladderEl = document.getElementById("moneyLadder");
        ladderEl.innerHTML = "";
        quizData.forEach((q, idx) => {
            const step = document.createElement("div");
            step.className = `ladder-step ${idx === currentIndex ? "active" : ""}`;
            step.innerHTML = `<span>${idx + 1}. ${q.prize}</span>`;
            ladderEl.appendChild(step);
        });
    }

    // Load Question & State
    function loadQuestion() {
        const current = quizData[currentIndex];
        document.getElementById("questionText").innerText = `${currentIndex + 1}. ${current.question}`;
        
        const optionsGrid = document.getElementById("optionsGrid");
        optionsGrid.innerHTML = "";

        const prefixes = ["A", "B", "C", "D"];
        current.options.forEach((opt, idx) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.id = `opt-${idx}`;
            btn.innerHTML = `<span class="opt-prefix">${prefixes[idx]}:</span> ${opt}`;
            
            // Check state
            if (userAnswers[currentIndex] !== null) {
                btn.disabled = true;
                if (idx === current.answer) btn.classList.add("correct");
                if (userAnswers[currentIndex] === idx && idx !== current.answer) {
                    btn.classList.add("wrong");
                }
            } else {
                btn.onclick = () => selectOption(idx);
            }

            optionsGrid.appendChild(btn);
        });

        // Update Bottom Hint
        const hintText = document.getElementById("hintText");
        if (userAnswers[currentIndex] !== null) {
            hintText.innerText = current.hint;
        } else {
            hintText.innerText = "Locked. Select your answer to reveal explanation and verify results.";
        }

        // Navigation state
        document.getElementById("prevBtn").disabled = currentIndex === 0;
        document.getElementById("nextBtn").innerText = currentIndex === quizData.length - 1 ? "Finish & Analyze" : "Next →";

        renderLadder();
    }

    // Select and lock an option
    function selectOption(selectedIdx) {
        userAnswers[currentIndex] = selectedIdx;
        loadQuestion();
    }

    // Back / Next Navigation
    function navigate(direction) {
        if (direction === 1 && currentIndex === quizData.length - 1) {
            showAnalysis();
            return;
        }
        currentIndex += direction;
        loadQuestion();
    }

    // Lifeline: 50-50
    function useFiftyFifty() {
        if (usedLifelines.fifty || userAnswers[currentIndex] !== null) return;
        
        const correct = quizData[currentIndex].answer;
        let incorrectIndexes = [0, 1, 2, 3].filter(i => i !== correct);
        
        // Pick 2 random incorrect options to hide
        incorrectIndexes.sort(() => Math.random() - 0.5);
        const toHide = incorrectIndexes.slice(0, 2);

        toHide.forEach(idx => {
            const btn = document.getElementById(`opt-${idx}`);
            if (btn) btn.classList.add("hidden");
        });

        usedLifelines.fifty = true;
        document.getElementById("ll-fifty").disabled = true;
    }

    // Lifeline: Audience Poll
    function useAudiencePoll() {
        if (usedLifelines.poll || userAnswers[currentIndex] !== null) return;

        const correct = quizData[currentIndex].answer;
        let percentages = [0, 0, 0, 0];
        
        // Give higher bias to correct answer
        percentages[correct] = Math.floor(Math.random() * 25) + 50; // 50% to 74%
        let remaining = 100 - percentages[correct];

        for (let i = 0; i < 4; i++) {
            if (i !== correct) {
                let share = Math.floor(Math.random() * remaining);
                percentages[i] = share;
                remaining -= share;
            }
        }
        percentages[percentages.indexOf(0)] += remaining; // Assign leftover

        // Render poll bars
        const barsContainer = document.getElementById("pollBars");
        barsContainer.innerHTML = "";
        const labels = ["A", "B", "C", "D"];

        percentages.forEach((pct, idx) => {
            const col = document.createElement("div");
            col.className = "poll-col";
            col.innerHTML = `
                <span style="font-size:0.75rem">${pct}%</span>
                <div class="poll-bar" style="height: ${pct * 1.3}px"></div>
                <strong>${labels[idx]}</strong>
            `;
            barsContainer.appendChild(col);
        });

        document.getElementById("pollModal").style.display = "flex";
        usedLifelines.poll = true;
        document.getElementById("ll-poll").disabled = true;
    }

    function closeModal() {
        document.getElementById("pollModal").style.display = "none";
    }

    // Lifeline: Flip Question
    function useFlipQuestion() {
        if (usedLifelines.flip || userAnswers[currentIndex] !== null) return;

        quizData[currentIndex] = { ...flippedQuestion, prize: quizData[currentIndex].prize };
        loadQuestion();

        usedLifelines.flip = true;
        document.getElementById("ll-flip").disabled = true;
    }

    // Final Analysis & Report Generation
    function showAnalysis() {
        document.getElementById("quizContainer").style.display = "none";
        document.getElementById("resultScreen").style.display = "block";

        let correct = 0;
        let wrong = 0;
        let lastPrizeWon = "₹ 0";

        userAnswers.forEach((ans, idx) => {
            if (ans === quizData[idx].answer) {
                correct++;
                lastPrizeWon = quizData[idx].prize;
            } else if (ans !== null) {
                wrong++;
            }
        });

        const total = quizData.length;
        const accuracy = Math.round((correct / total) * 100);

        document.getElementById("resTotal").innerText = total;
        document.getElementById("resCorrect").innerText = correct;
        document.getElementById("resWrong").innerText = wrong;
        document.getElementById("resAccuracy").innerText = `${accuracy}%`;
        document.getElementById("resPrize").innerText = lastPrizeWon;
    }

    // Restart Quiz
    function restartQuiz() {
        currentIndex = 0;
        userAnswers = new Array(quizData.length).fill(null);
        usedLifelines = { fifty: false, poll: false, flip: false };

        document.getElementById("ll-fifty").disabled = false;
        document.getElementById("ll-poll").disabled = false;
        document.getElementById("ll-flip").disabled = false;

        document.getElementById("resultScreen").style.display = "none";
        document.getElementById("quizContainer").style.display = "grid";

        init();
    }

    // Kickoff
    window.onload = init;
</script>

</body>
</html>
